<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vikram Bhai</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{background:#050505;color:#fff;min-height:100dvh;overflow:hidden;display:flex;align-items:center;justify-content:center;}

/* ── animated bg blobs ── */
.bg-layer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.blob{position:absolute;border-radius:50%;filter:blur(100px);opacity:.25;animation:blobMove 8s ease-in-out infinite alternate;}
.blob-1{width:280px;height:280px;background:#f5c84c;top:-60px;left:-80px;}
.blob-2{width:220px;height:220px;background:#e07c24;bottom:10%;right:-60px;animation-delay:3s;animation-duration:10s;}
.blob-3{width:180px;height:180px;background:#f5c84c;bottom:-40px;left:30%;animation-delay:5s;animation-duration:12s;}
@keyframes blobMove{0%{transform:translate(0,0) scale(1);}100%{transform:translate(40px,30px) scale(1.15);}}

/* ── grain overlay ── */
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.04;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:128px 128px;}

/* ── floating particles ── */
.particles{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
.particle{position:absolute;width:3px;height:3px;background:#f5c84c;border-radius:50%;opacity:0;animation:floatUp linear infinite;}
@keyframes floatUp{0%{opacity:0;transform:translateY(0) scale(0);}10%{opacity:.6;transform:scale(1);}90%{opacity:.3;}100%{opacity:0;transform:translateY(-100vh) scale(0);}}

.center-wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:28px;padding:20px;opacity:0;animation:fadeUp .8s .3s ease forwards;}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}

.logo-img{width:110px;height:110px;border-radius:28px;object-fit:cover;border:2px solid rgba(245,200,76,.2);box-shadow:0 0 50px rgba(245,200,76,.12);}

.name{font-size:36px;font-weight:900;color:#f5c84c;letter-spacing:-.5px;text-align:center;line-height:1;}

.download-btn{display:flex;align-items:center;justify-content:center;gap:12px;padding:18px 56px;border-radius:50px;font-size:17px;font-weight:800;text-decoration:none;color:#111;background:linear-gradient(90deg,#ffe08a,#f5c84c,#d4a012);box-shadow:0 0 40px rgba(245,200,76,.3),0 4px 20px rgba(245,200,76,.2);transition:all .25s ease;position:relative;overflow:hidden;}
.download-btn::before{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);animation:shimmer 3s ease-in-out infinite;}
@keyframes shimmer{0%{left:-100%;}50%,100%{left:150%;}}
.download-btn:active{transform:scale(.96);box-shadow:0 0 20px rgba(245,200,76,.3);}
.download-btn i{font-size:20px;}

/* ── toast ── */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);z-index:99999;background:rgba(8,45,24,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(76,255,153,.2);color:#4cff99;padding:10px 20px;border-radius:50px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;transition:transform .5s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast i{font-size:11px;}
</style>

n.callMethod.apply(n,arguments):n.queue.push(arguments)};

</head>
<body>

<!-- Background Effects -->
<div class="bg-layer">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>
<div class="grain"></div>
<div class="particles" id="particles"></div>

<!-- Toast -->
<div class="toast" id="toast">
  <i class="fas fa-user-plus"></i>
  <span id="toastText">Rahul just joined</span>
</div>

<!-- Center Content: Logo + Name + CTA -->
<div class="center-wrap">
  <img class="logo-img" src="vikrambhai.jpg" alt="Vikram Bhai">
  <div class="name">VIKRAM BHAI</div>
  <a class="download-btn" href="https://telegram.me/+L29Q3HuGLPtlMmU1" onclick="fbq('track','Subscribe');">
    <i class="fab fa-telegram"></i>
    Request to Join
  </a>
</div>

<script>
// ── Floating Particles ──
(function(){
  const container = document.getElementById('particles');
  for(let i = 0; i < 18; i++){
    const p = document.createElement('div');
    p.classList.add('particle');
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (6 + Math.random() * 10) + 's';
    p.style.animationDelay = (Math.random() * 8) + 's';
    p.style.width = p.style.height = (2 + Math.random() * 3) + 'px';
    container.appendChild(p);
  }
})();

// ── Toast Notifications ──
(function(){
  const names = [
    'Rahul just joined','Vikash just joined','Sunny just joined',
    'Deepak just joined','Aman just joined','Ravi just joined',
    'Karan just joined','Mohit just joined','Arjun just joined',
    'Nikhil just joined','Pankaj just joined','Suresh just joined'
  ];
  const toast = document.getElementById('toast');
  const toastText = document.getElementById('toastText');
  let idx = 0;
  function showToast(){
    toastText.textContent = names[idx % names.length];
    idx++;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }
  setTimeout(() => {
    showToast();
    setInterval(showToast, 8000 + Math.random() * 7000);
  }, 4000);
})();
</script>

</body>
